# ---------------------------------------------------------------------------
# Capacity limits enforced on every compute-heavy entry point
# (POST /api/simulation/run, /api/simulation/batch, /api/calibration/beta).
#
# All checks run BEFORE any heavy computation starts; an over-limit request is
# rejected with HTTP 422 (calibration: failureReason RESOURCE_LIMIT_EXCEEDED)
# and a machine-distinguishable reason equal to the violated dimension:
#   POPULATION | HORIZON_HOURS | REPLICATIONS | PARALLELISM |
#   CALIBRATION_EVALUATIONS | TOTAL_SIMULATED_HOURS
#
# Every value below can be overridden without rebuilding, e.g.:
#   - environment variable: APP_CAPACITY_MAX_REPLICATIONS=4000
#   - JVM system property:  -Dapp.capacity.max-replications=4000
#   - command line:         --app.capacity.max-replications=4000
#   - profile/override file: application-local.properties
# Bounds are inclusive: a request equal to a limit is accepted.
# ---------------------------------------------------------------------------
app.capacity.max-population=1000000
app.capacity.max-horizon-hours=50000
app.capacity.max-replications=1000
app.capacity.max-parallelism=16
app.capacity.max-calibration-evaluations=500
app.capacity.max-total-simulated-hours=20000000
