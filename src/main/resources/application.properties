# --- Resource capacity ceilings (enforced before computation on every
#     compute-heavy entry point: single simulation, batch, calibration) ---
# Override any of these via environment variables, e.g.
# EPIDEMIC_CAPACITY_MAX_REPLICATIONS=4000, or -D JVM system properties,
# e.g. -Depidemic.capacity.max-replications=4000.
# Max population size N of one scenario.
epidemic.capacity.max-population=10000000
# Max simulated horizon in hours per replication.
epidemic.capacity.max-horizon-hours=100000
# Max stochastic replications per batch / per calibration evaluation.
epidemic.capacity.max-replications=1000
# Max worker threads per request.
epidemic.capacity.max-parallelism=16
# Max objective evaluations per calibration.
epidemic.capacity.max-evaluations=500
# Max observation points in a calibration request.
epidemic.capacity.max-observations=100000
# Max aggregate work volume: replications x evaluations x simulated hours.
epidemic.capacity.max-total-simulated-hours=20000000
